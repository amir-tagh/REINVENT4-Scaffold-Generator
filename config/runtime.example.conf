# REINVENT4 V6 runtime configuration
# Copy this file to config/runtime.conf before customization.

# Conda environment names
REINVENT_ENV=reinvent4
ADMET_ENV=admet_ai
PKA_ENV=cns_mpo

# Optional absolute Python executable paths.
# Leave empty to automatically resolve Conda environments.
REINVENT_PY=""
ADMET_PY=""
PKA_PY=""

# External model locations (relative to repository root)
LIBINVENT_PRIOR="priors/libinvent.prior"
SCSCORE_REPO="scscore"
SCSCORE_MODEL="scscore/models/full_reaxys_model_1024bool/model.ckpt-10654.as_numpy.json.gz"

# Computational settings
REINVENT_DEVICE="cuda:0"
PKA_DEVICE="cuda"
CPU_THREADS=4
